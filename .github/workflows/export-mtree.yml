name: Export EU5 Mission Editor files
on:
  push:
    branches:
      - claude/nice-galileo-qr238h
    paths:
      - tools/du_missions/**
      - .github/workflows/export-mtree.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate editable mission trees
        run: python tools/du_missions/export_mtree.py
      - name: Commit exported .mtree files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor_missions/
          if ! git diff --cached --quiet; then
            git commit -m "Generate EU5 Mission Tree Editor files"
            git push
          fi
